version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: visit_sri_lanka_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: visitsrilanka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
